
apiVersion: apps/v1
kind: Deployment

metadata:
  name: task12-web-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: task12-web

  template:
    metadata:
      labels:
        app: task12-web

    spec:
      containers:
        - name: nginx-web
          image: nginx:stable
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
